        background: #0B0D12;

      html[data-theme='light'], html[data-theme='light'] body {
        background: #FAFBFC;
        color: #0B0D12;
      }
      #root:empty {
        min-height: 100svh;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(249,115,22,0.16) 0%, transparent 55%),
          linear-gradient(180deg, #0E1117 0%, #0B0D12 100%);

    <!-- Theme init (inline, zero-cost) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mbbswala-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
